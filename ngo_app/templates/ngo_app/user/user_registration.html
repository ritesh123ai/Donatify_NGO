<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    {% include 'ngo_app/common/common_css.html' %}

<style>
    .bg-image{
        background-image: url("{% static 'ngo_app/images/ngo11.jpg' %}");
        background-repeat: no-repeat;
        /* background-position: cover; */
        /* background-size: contain; */
         background-size:cover;
        /* background-size: 100% 100px; */
        background-position: center;
        
    }
    .inner{
        width: 50%;
        height: auto;
        justify-content: center;
        text-align: center;
        padding-top: 50px;
        margin: auto;
    }
        
        
        
    
</style>
</head>

<body>
    <!-- nav bar code start -->

{% include 'ngo_app/common/header.html'   %}



<!-- navbarcode end -->
 {% if messages %}
  
  {% for m in messages %}

  <div class="alert alert-danger alert-dismissible fade show" role="alert" style="width: 50%;margin: auto; text-align: center; font-size: 32px;">
  <strong>{{m}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
  <!-- <h1 style="text-align: center;">{{m}}</h1> -->
  <!-- message ko print krne ke liye double curly bracket use krte hai -->
  
  
  {% endfor %}
  
  {% endif %}

    <div class="main-div">
<div class="container-fluid">

    <div style="text-align: center;">
        
      <h2> Registration Form </h2>
    </div>
    <div class="inner">
      <form method="post" action="/user_registration/" enctype="multipart/form-data">
        {% csrf_token %}
        <!-- enctype tb use krenge jbhme user se kuch upload krana ho tb use krengee ki data binary form mai jaye -->
        <!-- form is used to gather information from user -->
    <div class="form-floating mb-3">
          <input type="email" name="email" class="form-control" id="floatingInput" placeholder="name@example.com">
          <label for="floatingInput">Enter Email here</label>
</div>
<div class="form-floating">
  <input type="password"  name="password" class="form-control" id="floatingPassword" placeholder="Password">
  <label for="floatingPassword">Enter Password here</label>
</div> <br>
<div class="form-floating mb-3">
  <input type="text" name="name" class="form-control" id="floatingInput" placeholder="name">
  <label for="floatingInput"> Enter Name</label>
</div>
<div class="form-floating mb-3">
  <input type="tel" name="phone" class="form-control" id="floatingInput" placeholder="enternumberhere">
  <label for="floatingInput">Enter Phone Number</label>
</div>
<div class="input-group mb-3">
  <input type="file" name="profile_pic" class="form-control" id="inputGroupFile02">
  <label class="input-group-text" for="inputGroupFile02">Upload</label>
</div>
<div style="text-align: center;">
    <button class="btn btn-primary" type="submit">Submit</button>
  </div>
  </form>
</div>
    
</div>


</div>
<!-- footer code start -->
 {% include 'ngo_app/common/footer.html'   %}
 <!-- footer code end -->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
