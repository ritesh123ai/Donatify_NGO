<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Form</title>
    {% include 'ngo_app/common/common_css.html' %}
    <style>
        .container{
            padding: 70px;
        }
        .form-container {
            width: 600px;
            margin:auto;
            background-color: rgb(149, 122, 23);
            padding: 30px;
            padding-top: 40px;
            border-radius: 15px;
            
        }
        .form-title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #343a40;
            padding-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Navbar Start -->
    {% include 'ngo_app/common/header.html' %}
    <!-- Navbar End -->

    <div class="container">
        <div class="form-container">
            <h3 class="form-title">Payment & Verification Form</h3>
            <form method="post" enctype="multipart/form-data" action="/donation/">
                {% csrf_token %}

                <!-- Amount Input -->
                <div class="input-group mb-3">
                    <span class="input-group-text">Amount</span>
                    <span class="input-group-text">₹</span>
                    <input type="text" class="form-control" name="amount" placeholder="Enter amount" required>
                </div>
          
<div style="text-align: center;">
                
                <button type="submit" id="generate_qr" class="btn btn-danger">Generate QR code</button>
              </div>

                     <div id="qr-container" class="mt-4" style="display: none;">
        <img id="qr-image" src="" alt="QR Code" class="img-fluid" style="max-width: 200px; margin-top: 10px;">
      </div>

                <div class="mb-3">
                    <label for="aadhaar_card" class="form-label">Upload Aadhaar Card</label>
                    <input class="form-control" type="file" id="aadhaar_card" name="aadhaar" required>
                </div>

               
                <div class="mb-4">
                    <label for="transaction_id"  class="form-label">Transaction ID</label>
                    <input type="number" class="form-control" id="transaction_id" name="transaction_id" required>
                </div>

           
                <div class="text-center">
                    <button type="submit" class="btn btn-primary w-50">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    {% include 'ngo_app/common/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
          <script>
document.getElementById('generate_qr').addEventListener('click', function(event) {
    event.preventDefault();  // Prevent form submit
    const amount = document.querySelector('input[name="amount"]').value;
    if (!amount) {
        alert("Please enter an amount.");
        return;
    }

    fetch('/generate_qr/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: `amount=${encodeURIComponent(amount)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.image) {
            const imgTag = document.getElementById('qr-image');
            imgTag.src = 'data:image/png;base64,' + data.image;
            document.getElementById('qr-container').style.display = 'block';
        } else {
            alert("Failed to generate QR code.");
        }
    })
    .catch(error => {
        console.error("Error:", error);
        alert("Error generating QR code.");
    });
});
</script>
</body>
</html>
