<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact_us</title>
    {% include 'ngo_app/common/common_css.html' %}
    <style>
        .outer {
            width: 100%;
            height: 600px;
            display: flex;
            justify-content: center;
            

        }

        .inner {
             width: 450px;
        height: 500px;
        /* border: 4px solid black; */
        /* border-radius: 10%; */
        /* background-color: rgb(157, 42, 42); */
        margin: 20px 40px 50px 70px;
        padding: auto;

        }
    </style>
</head>

<body>
    <div class="div-main">
        {% include 'ngo_app/common/header.html' %}
        {% if messages %}
  
  {% for m in messages %}

  <div class="alert alert-danger alert-dismissible fade show" role="alert" style="width: 50%;margin: auto; text-align: center; font-size: 44px;">
  <strong>{{m}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
  <!-- <h1 style="text-align: center;">{{m}}</h1> -->
  <!-- message ko print krne ke liye double curly bracket use krte hai -->
  
  
  {% endfor %}
  
  {% endif %}

        <div style="text-align: center;padding: 2%;">
            <a href="https://ibb.co/0p6bp7CS">
                <img src="https://i.ibb.co/kVwCV74f/Feel-Free-to-Reach-Us.gif" alt="Feel-Free-to-Reach-Us" border="0">
            </a>
        </div>

        <div class="outer">
            <div class="inner">
                <form action="/contact/" method="post" style="justify-content: center;padding: 10%;">
                    {% csrf_token %}
                
                    <div class="form-floating mb-3">
                        <input type="text" name="name" class="form-control" id="inputName" placeholder="name" required>
                        <label for="inputName">Name</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" name="email" class="form-control" id="inputEmail" placeholder="name@example.com" required>
                        <label for="inputEmail">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="number" name="phone" class="form-control" id="inputPhone" placeholder="number" required>
                        <label for="inputPhone">Phone number</label>
                    </div>
                    <div class="form-floating mb-3">
                        <textarea class="form-control" name="comment" placeholder="Leave a comment here" id="inputComments" style="height: 100px" required></textarea>
                        <label for="inputComments">Comments</label>
                    </div>
                    <div style="display: flex; justify-content: center;">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
</div>

        {% include 'ngo_app/common/footer.html' %}

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
                crossorigin="anonymous"></script>

</body>
<html>
